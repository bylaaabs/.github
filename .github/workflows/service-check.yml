# reusable: checks that the repo's `service.yaml` agrees with the map in
# `map/map/services.yaml`. the script lives in the map submodule of the
# calling repo, at `map/scripts/check.mjs`.
#
# a repo calls it from its own workflow:
#
#   jobs:
#     service:
#       uses: bylaaabs/.github/.github/workflows/service-check.yml@main
#       secrets: inherit
#
# `map` is a private submodule, so the caller needs a SUBMODULE_TOKEN
# secret (a fine-grained token with read access to it).
#
# it runs on `aaanvil-linux` (our own runners, private repos only) unless the
# caller says otherwise. a public repo must pass `runner: ubuntu-latest`:
#
#     with:
#       runner: ubuntu-latest

name: service check

on:
  workflow_call:
    inputs:
      runner:
        description: the runner label the job runs on. aaanvil-linux is our own box and takes private repos only; public repos must pass ubuntu-latest
        type: string
        default: aaanvil-linux
      service-file:
        description: the service declaration to check
        type: string
        default: service.yaml
    secrets:
      SUBMODULE_TOKEN:
        description: a token that can read the private submodules
        required: false

jobs:
  check:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node map/scripts/check.mjs ${{ inputs.service-file }}
