# reusable: builds a laaabs. web (vite + react + the ui kit as a submodule).
#
# a repo calls it from its own workflow:
#
#   jobs:
#     build:
#       uses: bylaaabs/.github/.github/workflows/web-build.yml@main
#       secrets: inherit
#
# the private submodules (`map`, `ui-web`, `brand`, `handbook`) need a token
# that can read them, and the caller needs no secret for it: on aaanvil
# (every private repo) the runner gives each job a read-only, hour-long token
# and sets git up to use it for those four repos only (bylaaabs/aaanvil
# `runner/job-started.sh`), so this checkout of the repo itself keeps
# github.token. a public repo, on github's runners, reaches public
# submodules only.
# deploys are not done here: workers builds deploy on push.
#
# the runner follows the calling repo's visibility: a private repo runs on
# `aaanvil-linux` (our own box, which refuses public repos), a public repo on
# github's `ubuntu-latest` (free for public repos). when the event says
# nothing about the repo, it falls back to `ubuntu-latest`, so a public repo
# never lands on our box. a caller can still force a label:
#
#     with:
#       runner: aaanvil-linux
#
# see bylaaabs/infra docs/runners.md.

name: web build

on:
  workflow_call:
    inputs:
      runner:
        description: force a runner label. empty picks one from the repo's visibility (private aaanvil-linux, public ubuntu-latest)
        type: string
        default: ""
      node-version:
        description: the node version to build with
        type: string
        default: "22"
    secrets:
      SUBMODULE_TOKEN:
        description: a token for the checkout (not needed for the private submodules on aaanvil, which hands each job one)
        required: false

jobs:
  build:
    runs-on: ${{ inputs.runner || (github.event.repository.private && 'aaanvil-linux' || 'ubuntu-latest') }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
