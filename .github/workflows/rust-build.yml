# reusable: builds, lints, formats and tests a rust workspace (a product core
# or a service).
#
# a repo calls it from its own workflow:
#
#   jobs:
#     rust:
#       uses: bylaaabs/.github/.github/workflows/rust-build.yml@main
#       secrets: inherit
#
# `map` is a private submodule, so the caller needs a SUBMODULE_TOKEN
# secret (a fine-grained token with read access to it). without it the
# checkout falls back to github.token, which only reaches public submodules.
#
# the runner follows the calling repo's visibility: a private repo runs on
# `aaanvil-linux` (our own box, which refuses public repos), a public repo on
# github's `ubuntu-latest` (free for public repos). when the event says
# nothing about the repo, it falls back to `ubuntu-latest`, so a public repo
# never lands on our box. a caller can still force a label:
#
#     with:
#       runner: aaanvil-linux
#
# see bylaaabs/infra docs/runners.md.

name: rust build

on:
  workflow_call:
    inputs:
      runner:
        description: force a runner label. empty picks one from the repo's visibility (private aaanvil-linux, public ubuntu-latest)
        type: string
        default: ""
      working-directory:
        description: where the cargo workspace lives (the repo root by default)
        type: string
        default: "."
    secrets:
      SUBMODULE_TOKEN:
        description: a token that can read the private submodules
        required: false

jobs:
  rust:
    runs-on: ${{ inputs.runner || (github.event.repository.private && 'aaanvil-linux' || 'ubuntu-latest') }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}
      - name: stable toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - name: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ inputs.working-directory }}/target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: cargo build --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo fmt --all --check
      - run: cargo test --workspace
